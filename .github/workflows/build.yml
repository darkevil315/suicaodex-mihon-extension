name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Require release keystore secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 repo secret. A persistent release keystore is required so every release is signed with the same certificate. See README.md for how to generate one and add it as a secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compute signing fingerprint
        id: fingerprint
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x scripts/print_signing_fingerprint.sh
          FINGERPRINT=$(scripts/print_signing_fingerprint.sh "$RUNNER_TEMP/release.jks" "$KEY_ALIAS" "$KEYSTORE_PASSWORD")
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Run offline generator tests
        run: python3 scripts/test_generate_index.py

      - name: Build release APK
        env:
          CI_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          CI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Assemble repo folder
        env:
          SIGNING_FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          set -e
          WEBSITE="https://github.com/${GITHUB_REPOSITORY}"
          RAW_BASE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/repo"

          # 1. Metadata SuicaoDex
          PKG="eu.kanade.tachiyomi.extension.vi.suicaodex"
          NAME="SuicaoDex"
          LANG="vi"
          VERSION_CODE=$(grep -m1 'val extVersionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          LIB_VERSION=$(grep -m1 'val libVersion' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_NAME="${LIB_VERSION}.${VERSION_CODE}"
          SOURCE_KT="app/src/main/java/eu/kanade/tachiyomi/extension/vi/suicaodex/SuicaoDex.kt"
          VERSION_ID=$(grep -m1 'override val versionId' "$SOURCE_KT" | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          if [ -z "$VERSION_ID" ]; then
            echo "::error::Could not read 'override val versionId' from $SOURCE_KT"
            exit 1
          fi

          # 2. Metadata Góc Truyện Tranh Vui
          PKG2="eu.kanade.tachiyomi.extension.vi.goctruyentranhvui"
          NAME2="Góc Truyện Tranh Vui"
          LANG2="vi"
          VERSION_CODE2=$(grep -m1 'val extVersionCode' goctruyentranhvui/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          LIB_VERSION2=$(grep -m1 'val libVersion' goctruyentranhvui/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_NAME2=$(grep -m1 'val extVersionName' goctruyentranhvui/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME2" ]; then
            VERSION_NAME2="${LIB_VERSION2}.${VERSION_CODE2}"
          fi
          SOURCE_KT2="goctruyentranhvui/src/main/java/eu/kanade/tachiyomi/extension/vi/goctruyentranhvui/GocTruyenTranhVui.kt"
          VERSION_ID2=$(grep -m1 'override val versionId' "$SOURCE_KT2" | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          if [ -z "$VERSION_ID2" ]; then
            VERSION_ID2="1"
          fi

          mkdir -p repo_out/apk repo_out/icon

          APK1=$(ls app/build/outputs/apk/release/*-release.apk | head -n 1)
          cp "$APK1" "repo_out/apk/${PKG}.apk"
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png "repo_out/icon/${PKG}.png"

          APK2=$(ls goctruyentranhvui/build/outputs/apk/release/*-release.apk | head -n 1)
          cp "$APK2" "repo_out/apk/${PKG2}.apk"
          cp goctruyentranhvui/src/main/res/mipmap-xxxhdpi/ic_launcher.png "repo_out/icon/${PKG2}.png"

          cat <<EOF > extensions.json
          [
            {
              "name": "$NAME",
              "pkg": "$PKG",
              "lang": "$LANG",
              "nsfw": true,
              "version_code": $VERSION_CODE,
              "version_name": "$VERSION_NAME",
              "lib_version": "$LIB_VERSION",
              "version_id": $VERSION_ID,
              "base_url": "https://suicaodex.com",
              "apk_filename": "${PKG}.apk"
            },
            {
              "name": "$NAME2",
              "pkg": "$PKG2",
              "lang": "$LANG2",
              "nsfw": true,
              "version_code": $VERSION_CODE2,
              "version_name": "$VERSION_NAME2",
              "lib_version": "$LIB_VERSION2",
              "version_id": $VERSION_ID2,
              "source_id": 7197999570080436874,
              "base_url": "https://goctruyentranhvui30.com",
              "apk_filename": "${PKG2}.apk"
            }
          ]
          EOF

          python3 scripts/generate_index.py \
            --extensions-json extensions.json \
            --repo-name "SuicaoDex & VN Extensions" \
            --badge-label "VN" \
            --version-id "$VERSION_ID" \
            --website "$WEBSITE" --signing-fingerprint "$SIGNING_FINGERPRINT" \
            --raw-base-url "$RAW_BASE_URL" --out-dir repo_out

          grep -q "$SIGNING_FINGERPRINT" repo_out/index.json

      - name: Publish to repo branch
        run: |
          set -e
          cd repo_out
          git init -q
          git checkout -q -b repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish repo: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin HEAD:repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
